[package]
name = "spotify-media-visuals"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
once_cell = "1"
windows = { version = "0.58", features = ["Media_Control", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_Com"] }
dirs = "6"
base64 = "0.22"
urlencoding = "2.1"

[profile.release]
strip = true
