[package]
name = "spotify-media-visuals"
version = "3.5.3"
edition = "2021"
build = "build.rs"

[lib]
name = "spotify_media_visuals"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
once_cell = "1"
dirs = "6"
base64 = "0.22"
urlencoding = "2.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
jni = "0.21"
ndk-context = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_System_Com"] }

[profile.release]
strip = true
