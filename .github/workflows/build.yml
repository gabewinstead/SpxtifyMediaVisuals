name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-media-visuals-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
      - name: Update latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $artifact = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          $signature = Get-Content "$($artifact.FullName).sig" -Raw
          $assetName = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[] | select(.name | endswith(".exe")) | .name'
          if (-not $assetName) {
            throw "Could not find the uploaded Windows installer asset in release $env:GITHUB_REF_NAME"
          }
          $latest = @{
            version = $version
            notes = "See the GitHub release notes."
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$([uri]::EscapeDataString($assetName))"
              }
            }
          } | ConvertTo-Json -Depth 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          Set-Content -Path latest.json -Value $latest -NoNewline
          git add latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update latest.json to v$version"
            git push origin main
          }

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
        continue-on-error: true
      - name: Install Android build packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      - run: npm run build
      - run: npx tauri android build --apk --target aarch64
      - run: npx tauri android build --aab --target aarch64
      - name: Sign Android release packages
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' | head -n 1)"
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*Release*.aab' | head -n 1)"
          if [[ -z "$apk" || -z "$aab" ]]; then
            echo "Android release packages were not produced." >&2
            exit 1
          fi
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            alias="$ANDROID_KEY_ALIAS"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured; using a temporary debug-compatible key for this direct APK."
            keystore="$RUNNER_TEMP/debug.keystore"
            keytool -genkeypair -v -keystore "$keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            alias=androiddebugkey
            store_password=android
            key_password=android
          fi
          aligned="$RUNNER_TEMP/aligned.apk"
          "$build_tools/zipalign" -f -p 4 "$apk" "$aligned"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$alias" \
            --ks-pass "pass:$store_password" --key-pass "pass:$key_password" \
            --out "NowPlaying.Visuals_${{ github.ref_name }}_android.apk" "$aligned"
          jarsigner -keystore "$keystore" -storepass "$store_password" \
            -keypass "$key_password" "$aab" "$alias"
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-media-visuals-android
          path: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*Release/*.aab
            NowPlaying.Visuals_*_android.apk
      - name: Publish Android release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/bundle/**/*Release/*.aab
            NowPlaying.Visuals_*_android.apk
